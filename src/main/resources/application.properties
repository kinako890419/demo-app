spring.application.name=app
server.port=8181

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
# /api-docs endpoint custom path
springdoc.api-docs.path=/api-docs

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_HOST_PORT:3333}/${MYSQL_DATABASE:app-db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:user}
spring.datasource.password=${MYSQL_PASSWORD:user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

## upload file directory
#file.upload-dir=

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

spring.jackson.time-zone=GMT+8

# JWT
jwt.secret=Unggea6AGald3M8ei0AAGEH9ou5STLCioqTbMNNn1gttf0lB650oGbEPSgMrtAhlsyQHsL73nvvL70gA5EiIwss9jgO1fizQTUMKWlo7e1KmW4sBE31qGngCuroYwEknwgBrflKp2hXRtMdUpdVDXw5erMiB7ShosgoP555Lhj1SxV5ZIbRd594ySme5ugV94EkATqqQ1vBQQ8aqh0AEQg4IXzcZLNcevUNkj263MenGFPm4nXySUECtfhGKqWFq
jwt.expiration-ms=86400000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# SSO
# Public host of this service, used to build SSO callback URLs.
# local-base-url is used instead when a login request passes isLocalDev=true.
app.base-url=http://localhost:8181
app.local-base-url=http://localhost:8181

# Dev seed data, only read by CommandLineAppStartupRunner to create OIDC_CONFIG rows.
# At runtime IdP settings come from the DB; existing rows are never overwritten (only blank fields are filled).
# The Keycloak values match dockerfiles/keycloak/app-realm.json (local dev only).
seed.oidc.keycloak.issuer-url=http://localhost:${KC_HOST_PORT:8888}/realms/app
seed.oidc.keycloak.client-id=app-oidc
seed.oidc.keycloak.client-secret=${KC_OIDC_CLIENT_SECRET:473913d8f42343495ed7a0ad0568692bee6bf53d485b79f6}
# SAML: the certificate is the realm's pinned signing key in dockerfiles/keycloak/app-realm.json
seed.saml.saml-test.idp-sso-url=http://localhost:${KC_HOST_PORT:8888}/realms/app/protocol/saml
seed.saml.saml-test.idp-entity-id=http://localhost:${KC_HOST_PORT:8888}/realms/app
seed.saml.saml-test.
# Leave blank to skip seeding the Google IdP
seed.oidc.google.client-id=
seed.oidc.google.client-secret=

# OTel
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4317
management.opentelemetry.tracing.export.otlp.transport=grpc
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4317
management.opentelemetry.logging.export.otlp.transport=grpc
management.tracing.sampling.probability=1.0
# W3C TraceContext propagation must match the browser OTel SDK which sends the 'traceparent' header.
management.tracing.propagation.type=w3c

# docker compose
spring.docker.compose.enabled=true
spring.docker.compose.file=dockerfiles/compose.yaml
